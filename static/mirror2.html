<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOGEO — Annonce</title><style>body{margin:0;background:#f4f6fa;color:#172033;font-family:system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:22px}.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:10px}.price{font-size:28px;font-weight:800}.muted{color:#667085}.btn{display:inline-block;padding:12px 16px;background:#111827;color:#fff;border-radius:10px;text-decoration:none;margin-top:10px}</style></head><body><main class="wrap"><div id="app" class="card">Chargement…</div></main><script>async function run(){const id=Number(new URLSearchParams(location.search).get('id'));try{const r=await fetch('/api/matches',{credentials:'same-origin'});if(!r.ok)throw Error();const x=await r.json(),l=(x.listings||[]).find(z=>Number(z.id)===id);if(!l)throw Error();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=Array.isArray(l.photos)?l.photos:[];app.innerHTML=(p.length?'<div class="gallery">'+p.map(u=>'<img src="'+esc(u)+'" loading="lazy">').join('')+'</div>':'')+'<h1>'+esc(l.title)+'</h1><div class="price">'+esc(l.price)+' € / mois</div><p class="muted">📍 '+esc(l.city)+' · '+esc(l.type)+' · '+esc(l.surface)+' m²</p><h2>Description</h2><p>'+esc(l.description||'Aucune description disponible.')+'</p>'+(l.source_url?'<a class="btn" href="'+esc(l.source_url)+'" target="_blank" rel="noopener">Voir l’annonce originale</a>':'')}catch(e){app.innerHTML='<h2>Impossible d’ouvrir cette annonce</h2><p>Vérifie que tu es connecté à ton compte étudiant.</p>'}}run()</script></body></html>
