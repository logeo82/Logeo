<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>LOGEO V0.2</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:system-ui,sans-serif}header{background:#111827;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}main{max-width:920px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:16px;margin:12px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}input,select{width:100%;padding:11px;margin-top:5px;border:1px solid #d6dbe5;border-radius:10px}button{padding:11px 15px;border:0;border-radius:10px;background:#111827;color:white;font-weight:700;margin:5px 4px 0 0}.secondary{background:#e8ecf3;color:#172033}.score{font-size:24px;font-weight:800}.green{color:#07864b}.orange{color:#ad6800}.muted{color:#667085}.tag{display:inline-block;padding:4px 8px;background:#eef2ff;border-radius:99px;font-size:12px;margin:3px}.hidden{display:none}.tabs{display:flex;gap:5px;overflow:auto}.err{color:#b42318}</style></head><body><header><div><b>LOGEO</b><div>Recherche intelligente de logement</div></div><button onclick='logout()'>Déconnexion</button></header><main><section id='auth' class='card'><h2>Créer un compte / Se connecter</h2><div class='grid'><label>Email<input id='email' type='email'></label><label>Mot de passe<input id='password' type='password'></label></div><button onclick='register()'>Créer mon compte</button><button class='secondary' onclick='login()'>Se connecter</button><p id='authmsg'></p></section><section id='app' class='hidden'><div class='card'><h2>👤 Mon profil</h2><div class='grid'><label>Nom<input id='name'></label><label>Ville<input id='city'></label><label>Budget max (€)<input id='budget' type='number'></label><label>Type<select id='type'><option>Studio</option><option>T1</option><option>T2</option><option>Colocation</option><option>Chambre</option></select></label><label>Surface min<input id='min_surface' type='number'></label><label>Distance max (km)<input id='max_distance' type='number'></label><label>Meublé<select id='furnished'><option value='any'>Peu importe</option><option value='yes'>Oui</option><option value='no'>Non</option></select></label><label>Date d'entrée<input id='move_date' type='date'></label></div><button onclick='saveProfile()'>Enregistrer et trouver mes logements</button></div><div class='tabs'><button onclick="tab('matches')">🏠 Matches</button><button class='secondary' onclick="tab('apps')">📄 Candidatures</button></div><div id='matches'></div><div id='apps' class='hidden'></div></section></main><script>async function api(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),x=await r.json();if(!r.ok)throw Error(x.error||'Erreur');return x}async function register(){try{await api('/api/register',{method:'POST',body:JSON.stringify({email:email.value,password:password.value,name:name?.value||''})});init()}catch(e){authmsg.textContent=e.message;authmsg.className='err'}}async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});init()}catch(e){authmsg.textContent=e.message;authmsg.className='err'}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}async function init(){let m=await api('/api/me');if(!m.authenticated)return;auth.classList.add('hidden');app.classList.remove('hidden');let u=m.user;for(let k of ['name','city','budget','type','min_surface','max_distance','furnished','move_date'])if(u[k]!=null)document.getElementById(k).value=u[k];loadMatches()}async function saveProfile(){let x={};for(let k of ['name','city','budget','type','min_surface','max_distance','furnished','move_date'])x[k]=document.getElementById(k).value;await api('/api/profile',{method:'POST',body:JSON.stringify(x)});loadMatches()}async function loadMatches(){let x=await api('/api/matches');matches.innerHTML=x.listings.length?x.listings.map(l=>`<div class='card'><div class='score ${l.score>=85?'green':l.score>=70?'orange':''}'>${l.score}% compatible</div><h2>${l.title}</h2><b>${l.price} €</b> · ${l.surface} m² · ${l.type}<br><span class='muted'>📍 ${l.distance_km} km · disponible ${l.available_date||'NC'}</span><p>${l.description||''}</p><div>${l.reasons.map(r=>`<span class='tag'>${r}</span>`).join('')}</div><button onclick='fav(${l.id})'>${l.favorite?'💔 Retirer':'❤️ Favori'}</button><button class='secondary' onclick='apply(${l.id})'>${l.application?'🟠 Candidature envoyée':'📄 Je candidate'}</button></div>`).join(''):'<div class="card">Aucun logement compatible. Élargis légèrement tes critères.</div>'}async function fav(id){await api('/api/favorite/'+id,{method:'POST'});loadMatches()}async function apply(id){await api('/api/application/'+id,{method:'POST'});loadMatches();loadApps()}async function loadApps(){let x=await api('/api/applications');apps.innerHTML='<div class="card"><h2>📄 Mes candidatures</h2>'+(x.applications.length?x.applications.map(a=>`<p><b>${a.title}</b> — ${a.status}</p>`).join(''):'Aucune candidature')+'</div>'}function tab(t){matches.classList.toggle('hidden',t!=='matches');apps.classList.toggle('hidden',t!=='apps');if(t==='apps')loadApps()}init()</script></body></html>
