<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOGEO V0.5</title></head><body><main><section id="ownerApp"><div class="card"><h2>🏠 Espace propriétaire / agence</h2><div id="ownerMarket" style="border:2px solid #111827;border-radius:16px;padding:18px;margin:16px 0;background:#fff"><h3>🔎 Chercher-Trouver</h3><p>Rechercher automatiquement les annonces immobilières disponibles.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Ville<input id="marketCity" placeholder="Ex. Montauban"></label><label>Transaction<select id="marketTransaction"><option value="sale">Vente</option><option value="rent">Location</option></select></label><label>Type<select id="marketType"><option value="all">Tous</option><option value="apartment">Appartement</option><option value="house">Maison</option></select></label><label>Prix maximum<input id="marketMaxPrice" type="number"></label></div><button id="marketSearchBtn" style="margin-top:12px;padding:12px 18px;background:#111827;color:white;border:0;border-radius:10px;font-weight:700">🔎 Rechercher les annonces</button><div id="marketMsg"></div><div id="marketResults"></div></div></div></section></main><script>async function marketSearch(){const msg=document.getElementById('marketMsg'),out=document.getElementById('marketResults');msg.textContent='Recherche en cours…';out.innerHTML='';try{const q=new URLSearchParams({city:document.getElementById('marketCity').value,transaction:document.getElementById('marketTransaction').value,type:document.getElementById('marketType').value,max_price:document.getElementById('marketMaxPrice').value});let r=await fetch('/api/owner/market/search?'+q);let x=await r.json();if(!r.ok)throw Error(x.error||'Erreur');msg.textContent=x.listings?.length+' annonces trouvées';out.innerHTML=(x.listings||[]).map(l=>'<div style="border-top:1px solid #ddd;padding:14px 0"><b>'+String(l.title||'Annonce')+'</b><br>'+String(l.price||'Prix NC')+' € · '+String(l.surface||'')+' m² · '+String(l.city||'')+'<br><button onclick="importMarket('+l.id+')">📥 Importer dans Logeo</button></div>').join('')}catch(e){msg.textContent='Erreur : '+e.message}}async function importMarket(id){const r=await fetch('/api/owner/market/import/'+id,{method:'POST'});const x=await r.json();alert(r.ok?'Annonce importée dans Logeo !':(x.error||'Import impossible'))}document.getElementById('marketSearchBtn').onclick=marketSearch;</script></body></html>
