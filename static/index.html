<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>LOGEO V0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:system-ui,sans-serif}header{background:#111827;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}main{max-width:920px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:16px;margin:12px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}input,select,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #d6dbe5;border-radius:10px;font:inherit}textarea{min-height:90px}button{padding:11px 15px;border:0;border-radius:10px;background:#111827;color:white;font-weight:700;margin:5px 4px 0 0}.secondary{background:#e8ecf3;color:#172033}.score{font-size:24px;font-weight:800}.green{color:#07864b}.orange{color:#ad6800}.muted{color:#667085}.tag{display:inline-block;padding:4px 8px;background:#eef2ff;border-radius:99px;font-size:12px;margin:3px}.hidden{display:none}.tabs{display:flex;gap:5px;overflow:auto}.err{color:#b42318}.ok{color:#087443}.role{display:flex;gap:8px}.role button{flex:1}.selected{outline:3px solid #8aa4ff}</style></head><body><header><div><b>LOGEO</b><div>Recherche intelligente de logement</div></div><button onclick='logout()'>Déconnexion</button></header><main><section id='auth' class='card'><h2>Bienvenue sur LOGEO</h2><p>Choisis ton profil pour commencer.</p><div class='role'><button id='studentBtn' class='selected' onclick='setRole("student")'>🎓 Étudiant</button><button id='ownerBtn' class='secondary' onclick='setRole("owner")'>🏠 Propriétaire / agence</button></div><div class='grid'><label>Email<input id='email' type='email'></label><label>Mot de passe<input id='password' type='password'></label><label>Nom<input id='authname'></label></div><button onclick='register()'>Créer mon compte</button><button class='secondary' onclick='login()'>Se connecter</button><p id='authmsg'></p></section><section id='studentApp' class='hidden'><div class='card'><h2>👤 Mon profil étudiant</h2><div class='grid'><label>Nom<input id='name'></label><label>Ville<input id='city'></label><label>Budget max (€)<input id='budget' type='number'></label><label>Type<select id='type'><option>Studio</option><option>T1</option><option>T2</option><option>Colocation</option><option>Chambre</option></select></label><label>Surface min<input id='min_surface' type='number'></label><label>Distance max (km)<input id='max_distance' type='number'></label><label>Meublé<select id='furnished'><option value='any'>Peu importe</option><option value='yes'>Oui</option><option value='no'>Non</option></select></label><label>Date d'entrée<input id='move_date' type='date'></label><label>Établissement<input id='school'></label></div><button onclick='saveProfile()'>🔎 Enregistrer et trouver mes logements</button></div><div class='tabs'><button onclick="tab('matches')">🏠 Matches</button><button class='secondary' onclick="tab('apps')">📄 Candidatures</button></div><div id='matches'></div><div id='apps' class='hidden'></div></section><section id='ownerApp' class='hidden'><div class='card'><h2>🏠 Espace propriétaire / agence</h2><p class='muted'>Publie un logement et reçois les candidats compatibles.</p><h3>Nouvelle annonce</h3><div class='grid'><label>Titre<input id='ltitle' placeholder='Studio centre-ville'></label><label>Ville<input id='lcity' placeholder='Montauban'></label><label>Loyer (€)<input id='lprice' type='number'></label><label>Surface (m²)<input id='lsurface' type='number'></label><label>Type<select id='ltype'><option>Studio</option><option>T1</option><option>T2</option><option>Colocation</option><option>Chambre</option></select></label><label>Distance de référence (km)<input id='ldistance' type='number' value='0'></label><label>Meublé<select id='lfurnished'><option value='yes'>Oui</option><option value='no'>Non</option></select></label><label>Disponible le<input id='ldate' type='date'></label></div><label>Description<textarea id='ldesc' placeholder='Description du logement...'></textarea><button onclick='createListing()'>➕ Publier l'annonce</button><p id='ownerMsg'></p></div><div class='tabs'><button onclick="ownerTab('myListings')">📢 Mes annonces</button><button class='secondary' onclick="ownerTab('ownerApps')">👥 Candidatures</button></div><div id='myListings'></div><div id='ownerApps' class='hidden'></div></section></main><script>let role='student';async function api(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),x=await r.json();if(!r.ok)throw Error(x.error||'Erreur');return x}function setRole(r){role=r;studentBtn.classList.toggle('selected',r==='student');ownerBtn.classList.toggle('selected',r==='owner')}async function register(){try{await api('/api/register',{method:'POST',body:JSON.stringify({email:email.value,password:password.value,name:authname.value,role})});init()}catch(e){authmsg.textContent=e.message;authmsg.className='err'}}async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});init()}catch(e){authmsg.textContent=e.message;authmsg.className='err'}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}async function init(){let m=await api('/api/me');if(!m.authenticated)return;auth.classList.add('hidden');if(m.user.role==='owner'){ownerApp.classList.remove('hidden');loadOwner()}else{studentApp.classList.remove('hidden');let u=m.user;for(let k of ['name','city','budget','type','min_surface','max_distance','furnished','move_date','school'])if(u[k]!=null&&document.getElementById(k))document.getElementById(k).value=u[k];loadMatches()}}async function saveProfile(){let x={};for(let k of ['name','city','budget','type','min_surface','max_distance','furnished','move_date','school'])x[k]=document.getElementById(k).value;await api('/api/profile',{method:'POST',body:JSON.stringify(x)});loadMatches()}async function loadMatches(){let x=await api('/api/matches');matches.innerHTML=x.listings.length?x.listings.map(l=>`<div class='card'><div class='score ${l.score>=85?'green':l.score>=70?'orange':''}'>${l.score}% compatible</div><h2>${l.title}</h2><b>${l.price} €</b> · ${l.surface} m² · ${l.type}<br><span class='muted'>📍 ${l.city} · ${l.distance_km} km · disponible ${l.available_date||'NC'}</span><p>${l.description||''}</p><div>${l.reasons.map(r=>`<span class='tag'>${r}</span>`).join('')}</div><button onclick='fav(${l.id})'>${l.favorite?'💔 Retirer':'❤️ Favori'}</button><button class='secondary' onclick='apply(${l.id})'>${l.application?'🟠 Candidature envoyée':'📄 Je candidate'}</button></div>`).join(''):'<div class="card">Aucun logement compatible. Élargis légèrement tes critères.</div>'}async function fav(id){await api('/api/favorite/'+id,{method:'POST'});loadMatches()}async function apply(id){await api('/api/application/'+id,{method:'POST'});loadMatches();loadApps()}async function loadApps(){let x=await api('/api/applications');apps.innerHTML='<div class="card"><h2>📄 Mes candidatures</h2>'+(x.applications.length?x.applications.map(a=>`<p><b>${a.title}</b> — <span class='tag'>${a.status}</span></p>`).join(''):'Aucune candidature')+'</div>'}function tab(t){matches.classList.toggle('hidden',t!=='matches');apps.classList.toggle('hidden',t!=='apps');if(t==='apps')loadApps()}async function createListing(){try{let x={title:ltitle.value,city:lcity.value,price:lprice.value,surface:lsurface.value,type:ltype.value,distance_km:ldistance.value,furnished:lfurnished.value,available_date:ldate.value,description:ldesc.value};await api('/api/owner/listings',{method:'POST',body:JSON.stringify(x)});ownerMsg.textContent='Annonce publiée !';ownerMsg.className='ok';['ltitle','lcity','lprice','lsurface','ldate','ldesc'].forEach(id=>document.getElementById(id).value='');loadOwner()}catch(e){ownerMsg.textContent=e.message;ownerMsg.className='err'}}async function loadOwner(){let l=await api('/api/owner/listings');myListings.innerHTML='<div class="card"><h2>📢 Mes annonces</h2>'+(l.listings.length?l.listings.map(a=>`<p><b>${a.title}</b> — ${a.price} € · ${a.surface} m² · ${a.city}</p>`).join(''):'Aucune annonce publiée')+'</div>';loadOwnerApps()}async function loadOwnerApps(){let x=await api('/api/owner/applications');ownerApps.innerHTML='<div class="card"><h2>👥 Candidatures reçues</h2>'+(x.applications.length?x.applications.map(a=>`<div class='card'><b>${a.title}</b><br>👤 ${a.name||'Candidat'} · ${a.email}<br>📍 ${a.city||'NC'} · budget ${a.budget||'NC'} € · ${a.type||'NC'}<br><span class='tag'>${a.status}</span><br><button onclick='setApp(${a.user_id},${a.listing_id},"reviewed")'>👀 Vu</button><button onclick='setApp(${a.user_id},${a.listing_id},"accepted")'>✅ Accepter</button><button class='secondary' onclick='setApp(${a.user_id},${a.listing_id},"rejected")'>❌ Refuser</button></div>`).join(''):'Aucune candidature reçue')+'</div>'}async function setApp(uid,lid,status){await api(`/api/owner/application/${uid}/${lid}`,{method:'POST',body:JSON.stringify({status})});loadOwnerApps()}function ownerTab(t){myListings.classList.toggle('hidden',t!=='myListings');ownerApps.classList.toggle('hidden',t!=='ownerApps');if(t==='ownerApps')loadOwnerApps()}init()</script></body></html>
